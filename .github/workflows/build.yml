name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Generate Complete Gradle Project
        run: |
          mkdir -p android-app/app/src/main/assets/www
          cp index.html android-app/app/src/main/assets/www/

          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.zaid.player">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
              <application
                  android:allowBackup="true"
                  android:label="Zaid Player"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          mkdir -p android-app/app/src/main/java/com/zaid/player
          cat << 'EOF' > android-app/app/src/main/java/com/zaid/player/MainActivity.java
          package com.zaid.player;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/www/index.html");
                  setContentView(webView);
              }
          }
          EOF

          cat << 'EOF' > android-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.zaid.player'
              compileSdk 34
              defaultConfig {
                  applicationId "com.zaid.player"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > android-app/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.1'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          cat << 'EOF' > android-app/settings.gradle
          rootProject.name = "ZaidPlayer"
          include ':app'
          EOF

          cat << 'EOF' > android-app/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m
          EOF

          mkdir -p android-app/gradle/wrapper
          cat << 'EOF' > android-app/gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.1.1-bin.zip
          systemProp.file.encoding=UTF-8
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

      - name: Build APK with Native Gradle 8.1.1
        run: |
          cd android-app
          gradle -version
          # Download wrapper jar or use direct execution
          python3 -c "
          import urllib.request
          url = 'https://raw.githubusercontent.com/gradle/gradle/v8.1.1/subprojects/wrapperfiles/gradle-wrapper.jar'
          urllib.request.urlretrieve(url, 'gradle/wrapper/gradle-wrapper.jar')
          "
          javac -version
          # Build using gradle runner directly pointing to 8.1.1 environment
          mvn --version || true
          # Direct invocation via SDK gradle
          gradle --init-script <(echo \"allprojects { repositories { google(); mavenCentral() } }\") assembleDebug || ./gradlew assembleDebug || true
          
          # Fallback explicit build execution
          mkdir -p app/build/outputs/apk/debug/
          # Let's run gradle through a standalone gradle runner or direct assemble
          find . -name gradlew
          chmod +x gradlew || true
          ./gradlew assembleDebug --no-daemon || gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaid-Player
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
