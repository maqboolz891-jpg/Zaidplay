name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Android Web Wrapper Structure
        run: |
          mkdir -p android-app/app/src/main/assets/www
          mkdir -p android-app/app/src/main/res/mipmap-hdpi
          
          # Copy your web app files
          cp -r www/* android-app/app/src/main/assets/www/

          # Create AndroidManifest.xml
          cat << 'EOF' > android-app/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.zaid.player">
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Zaid Player"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          # Create MainActivity.java
          mkdir -p android-app/app/src/main/java/com/zaid/player
          cat << 'EOF' > android-app/app/src/main/java/com/zaid/player/MainActivity.java
          package com.zaid.player;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  WebView webView = new WebView(this);
                  WebSettings settings = webView.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/www/index.html");
                  setContentView(webView);
              }
          }
          EOF

          # Create build.gradle for the app
          cat << 'EOF' > android-app/app/build.gradle
          plugins {
              id 'com.android.application'
          }
          android {
              namespace 'com.zaid.player'
              compileSdk 34
              defaultConfig {
                  applicationId "com.zaid.player"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                release {
                  minifyEnabled false
                }
              }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          # Create project-level build.gradle
          cat << 'EOF' > android-app/build.gradle
          buildscript {
              repositories {
                  google()
                  mavenCentral()
              }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.1.0'
              }
          }
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          EOF

          # Create settings.gradle
          cat << 'EOF' > android-app/settings.gradle
          rootProject.name = "ZaidPlayer"
          include ':app'
          EOF

          # Create gradle.properties
          cat << 'EOF' > android-app/gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

      - name: Build APK with Gradle
        run: |
          cd android-app
          chmod +x gradlew || true
          gradle wrapper
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaid-Player
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          
