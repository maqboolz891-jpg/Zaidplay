name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Cordova Globally
        run: npm install -g cordova@12.0.0

      - name: Create Project and Setup Platform
        run: |
          cordova create myapp com.zaheer.player ZaheerPlayer
          cd myapp
          rm -rf www/*
          cp -r ../www/* www/
          npm i --save cordova-android@12.0.0
          cordova platform add android --nosave

      - name: Build Debug APK
        run: |
          cd myapp
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zaheer-Player
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
